<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Gallery Upload - Chaveirim of Linden</title>
  <link rel="stylesheet" href="../assets/css/styles.css"/>
  <style>
    .admin-upload-wrap { max-width: 700px; margin: 70px auto; padding: 0 20px; }
    .admin-upload-card { background: #fff; border: 1px solid #ececec; border-radius: 14px; box-shadow: 0 2px 12px rgba(176,48,32,0.10); padding: 24px; }
    .admin-upload-card h1 { color: #b03020; margin-bottom: 8px; }
    .admin-upload-card p { color: #825a5a; margin-bottom: 14px; }
    .admin-upload-form { display: flex; flex-direction: column; gap: 10px; }
    .admin-upload-form input[type="password"], .admin-upload-form input[type="file"] { padding: 10px 12px; border: 1px solid #e8cfcc; border-radius: 10px; font: inherit; }
    .admin-upload-message { min-height: 1.2em; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body>
 <div class="gallery-upload-panel">
      <h2>Add an Image</h2>
      <p>To upload an image to this gallery, enter the password and choose a file.</p>
      <div class="gallery-upload-actions">
        <input type="password" id="gallery-upload-password" placeholder="Enter upload password" autocomplete="off" />
        <input type="file" id="gallery-upload-input" accept="image/*" />
        <button type="button" id="gallery-upload-button" class="btn-navy">Upload Image</button>
      </div>
      <p id="gallery-upload-message" class="gallery-upload-message" aria-live="polite"></p>
    </div>

  <script src="../assets/js/gallery-upload.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.COLGalleryUpload?.bindUploadForm({
        onSuccess: () => {
          const message = document.getElementById('gallery-upload-message');
          if (message) {
            message.textContent = 'Image uploaded successfully. Open the Gallery page to view it.';
            message.style.color = '#b03020';
          }
        },
      });
    });
  </script>
</body>
</html>
